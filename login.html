<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Login to HealthBridge to access your health dashboard."
    />
    <title>Login - HealthBridge</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="pics/favicon.svg" />
  </head>
  <body>
    <!-- Simple Navbar -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-icon">🏥</div>
          <span>HealthBridge</span>
        </a>
        <button class="lang-toggle" onclick="toggleLanguage()">AR/EN</button>
      </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container" style="margin-top: 3rem; margin-bottom: 3rem">
      <div class="auth-header">
        <div
          class="logo-icon"
          style="
            margin: 0 auto 1rem;
            width: 64px;
            height: 64px;
            font-size: 2rem;
          "
        >
          🏥
        </div>
        <h2 data-translate="welcomeBack">Welcome Back</h2>
        <p data-translate="signInToAccess">
          Sign in to access your health dashboard
        </p>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login" data-translate="login">
          Login
        </button>
        <button class="tab-btn" data-tab="signup" data-translate="signUp">
          Sign Up
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label data-translate="emailPhone">Email / Phone</label>
          <input
            type="text"
            id="email"
            required
            data-translate-placeholder="enterEmail"
            placeholder="Enter your email or phone"
          />
        </div>
        <div class="form-group">
          <label data-translate="password">Password</label>
          <input
            type="password"
            id="password"
            required
            data-translate-placeholder="enterPassword"
            placeholder="Enter your password"
          />
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
          "
        >
          <label
            style="
              display: flex;
              align-items: center;
              gap: 0.5rem;
              font-weight: normal;
              color: var(--text-secondary);
              cursor: pointer;
            "
          >
            <input type="checkbox" style="width: auto" />
            <span data-translate="rememberMe">Remember me</span>
          </label>
          <a
            href="#"
            style="
              color: var(--primary);
              text-decoration: none;
              font-weight: 500;
            "
            data-translate="forgotPassword"
            >Forgot Password?</a
          >
        </div>
        <button
          type="submit"
          class="btn btn-primary"
          style="width: 100%"
          data-translate="signIn"
        >
          Sign In
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signup-form" class="auth-form hidden">
        <div class="form-group">
          <label data-translate="fullName">Full Name</label>
          <input
            type="text"
            id="signup-name"
            required
            data-translate-placeholder="enterFullName"
            placeholder="Enter your full name"
          />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="signup-email"
            required
            data-translate-placeholder="enterEmail"
            placeholder="Enter your email"
          />
        </div>
        <div class="form-group">
          <label data-translate="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="signup-phone"
            required
            data-translate-placeholder="enterPhone"
            placeholder="Enter your phone number"
          />
        </div>
        <div class="form-group">
          <label data-translate="userType">User Type</label>
          <select
            id="user-type"
            style="
              width: 100%;
              padding: 0.75rem;
              border: 2px solid #e2e8f0;
              border-radius: var(--radius-md);
              font-size: 1rem;
              background: var(--surface);
            "
          >
            <option value="patient" data-translate="patient">Patient</option>
            <option value="doctor" data-translate="doctor">Doctor</option>
          </select>
        </div>
        <div class="form-group">
          <label data-translate="password">Password</label>
          <input
            type="password"
            id="signup-password"
            required
            data-translate-placeholder="enterPassword"
            placeholder="Create a password"
          />
        </div>
        <div class="form-group">
          <label data-translate="confirmPassword">Confirm Password</label>
          <input
            type="password"
            required
            data-translate-placeholder="confirmYourPassword"
            placeholder="Confirm your password"
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary"
          style="width: 100%"
          data-translate="createAccount"
        >
          Create Account
        </button>
      </form>

      <div class="social-login">
        <p
          style="margin-bottom: 1rem; color: var(--text-muted)"
          data-translate="orContinueWith"
        >
          Or continue with
        </p>
        <button
          class="btn google-btn"
          onclick="showToast('Google login coming soon!')"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>
          <span data-translate="google">Google</span>
        </button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
