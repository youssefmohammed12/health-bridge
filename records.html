<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Access your medical records securely with HealthBridge."
    />
    <title>Medical Records - HealthBridge</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/svg+xml" href="pics/favicon.svg" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-icon">🏥</div>
          <span>HealthBridge</span>
        </a>
        <div class="nav-menu" id="nav-menu">
          <ul class="nav-links">
            <li><a href="index.html" data-translate="home">Home</a></li>
            <li><a href="doctors.html" data-translate="doctors">Doctors</a></li>
            <li><a href="about.html" data-translate="aboutUs">About Us</a></li>
            <li>
              <a href="contact.html" data-translate="contactUs">Contact Us</a>
            </li>
            <li><a href="support.html" data-translate="support">Support</a></li>
          </ul>
          <div class="nav-actions">
            <button class="lang-toggle" onclick="toggleLanguage()">
              AR/EN
            </button>
            <div id="auth-links">
              <a
                href="login.html"
                class="btn btn-outline"
                data-translate="login"
                >Login</a
              >
              <a
                href="login.html#signup"
                class="btn btn-primary"
                data-translate="signUp"
                >Sign Up</a
              >
            </div>
          </div>
        </div>
        <button
          id="mobile-menu-btn"
          class="mobile-menu"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          &#9776;
        </button>
      </div>
    </nav>

    <div class="dashboard">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 2rem">
          <div
            style="
              width: 90px;
              height: 90px;
              background: linear-gradient(
                135deg,
                var(--primary-subtle) 0%,
                var(--secondary-subtle) 100%
              );
              border-radius: 50%;
              margin: 0 auto 1rem;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 2.5rem;
            "
          >
            👤
          </div>
          <h3 data-translate="patient">Patient</h3>
        </div>
        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html">
              <span>📊</span> <span data-translate="dashboard">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="appointments.html">
              <span>📅</span>
              <span data-translate="appointments">Appointments</span>
            </a>
          </li>
          <li>
            <a href="records.html" class="active">
              <span>📋</span>
              <span data-translate="medicalRecords">Medical Records</span>
            </a>
          </li>
          <li>
            <a href="support.html">
              <span>💬</span> <span data-translate="support">Support</span>
            </a>
          </li>
          <li>
            <a href="settings.html">
              <span>⚙️</span> <span data-translate="settings">Settings</span>
            </a>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
          "
        >
          <h2 data-translate="medicalRecords">Medical Records</h2>
          <div style="display: flex; gap: 0.5rem">
            <button
              class="btn btn-outline"
              id="filter-btn"
              onclick="showToast('Filter coming soon!')"
              data-translate="filter"
            >
              Filter
            </button>
            <button
              class="btn btn-secondary"
              id="export-btn"
              onclick="showToast('Exporting records...')"
              data-translate="exportAll"
            >
              Export All
            </button>
          </div>
        </div>

        <!-- Filter Buttons -->
        <div
          style="
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
          "
        >
          <button
            class="btn btn-primary filter-btn"
            data-translate="allRecords"
          >
            All Records
          </button>
          <button
            class="btn btn-outline filter-btn"
            data-translate="labResults"
          >
            Lab Results
          </button>
          <button
            class="btn btn-outline filter-btn"
            data-translate="prescriptions"
          >
            Prescriptions
          </button>
          <button class="btn btn-outline filter-btn" data-translate="diagnoses">
            Diagnoses
          </button>
          <button class="btn btn-outline filter-btn" data-translate="imaging">
            Imaging
          </button>
        </div>

        <!-- Records List -->
        <div
          id="records-list"
          class="card-grid"
          style="grid-template-columns: 1fr"
        >
          <!-- Records loaded by JavaScript -->
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
