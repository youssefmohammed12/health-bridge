<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Doctors - HealthBridge</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-icon">🏥</div>
          <span>HealthBridge</span>
        </a>

        <ul class="nav-links">
          <li><a href="index.html" data-translate="home">Home</a></li>
          <li><a href="doctors.html" data-translate="doctors">Doctors</a></li>
          <li><a href="about.html" data-translate="aboutUs">About Us</a></li>
          <li>
            <a href="contact.html" data-translate="contactUs">Contact Us</a>
          </li>
          <li><a href="support.html" data-translate="support">Support</a></li>
        </ul>

        <div class="nav-actions">
          <button class="lang-toggle" onclick="toggleLanguage()">AR/EN</button>
          <div id="auth-links">
            <a href="login.html" class="btn btn-outline" data-translate="login"
              >Login</a
            >
            <a
              href="login.html#signup"
              class="btn btn-primary"
              data-translate="signUp"
              >Sign Up</a
            >
          </div>
        </div>
      </div>
    </nav>

    <section style="padding: 3rem 2rem; max-width: 1200px; margin: 0 auto">
      <div style="text-align: center; margin-bottom: 3rem">
        <h1 data-translate="doctors">Our Medical Specialists</h1>
        <p
          style="color: var(--text-light); margin-top: 0.5rem"
          data-translate="findDoctor"
        >
          Find the right doctor for your needs
        </p>
      </div>

      <div
        style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap"
      >
        <input
          type="text"
          id="search-input"
          data-translate-placeholder="searchDoctors"
          placeholder="Search doctors..."
          style="
            flex: 1;
            min-width: 200px;
            padding: 0.75rem;
            border: 2px solid var(--accent);
            border-radius: var(--radius-sm);
          "
        />

        <select
          id="specialty-filter"
          style="
            padding: 0.75rem;
            border: 2px solid var(--accent);
            border-radius: var(--radius-sm);
            min-width: 150px;
          "
        >
          <option value="all" data-translate="allSpecialties">
            All Specialties
          </option>
          <option value="Cardiology" data-translate="cardiology">
            Cardiology
          </option>
          <option value="Dermatology" data-translate="dermatology">
            Dermatology
          </option>
          <option value="Neurology" data-translate="neurology">
            Neurology
          </option>
          <option value="Pediatrics" data-translate="pediatrics">
            Pediatrics
          </option>
          <option value="Orthopedics" data-translate="orthopedics">
            Orthopedics
          </option>
          <option value="Dentistry" data-translate="dentistry">
            Dentistry
          </option>
          <option value="Ophthalmology" data-translate="ophthalmology">
            Ophthalmology
          </option>
          <option value="Gynecology" data-translate="gynecology">
            Gynecology
          </option>
        </select>

        <select
          style="
            padding: 0.75rem;
            border: 2px solid var(--accent);
            border-radius: var(--radius-sm);
          "
        >
          <option value="all" data-translate="availability">
            Availability
          </option>
          <option value="available" data-translate="availableNow">
            Available Now
          </option>
          <option value="today" data-translate="today">Today</option>
          <option value="week" data-translate="thisWeek">This Week</option>
        </select>
      </div>

      <div id="doctors-list" class="doctor-grid">
        <!-- Doctors loaded by JavaScript -->
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
